<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Outsourced Part Form</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <style>
        /* Simple styling to make the labels line up nicely */
        label {
            display: inline-block;
            width: 150px;
            font-weight: bold;
        }
        .text-danger {
            color: red;
            margin-left: 10px;
        }
    </style>
</head>
<body>
<h1>Outsourced Part Detail</h1>

<form action="#" th:action="@{/showFormAddOutPart}" th:object="${outsourcedpart}" method="POST">
    <input type="hidden" th:field="*{id}"/>

    <p>
        <label for="name">Name:</label>
        <input type="text" id="name" th:field="*{name}" placeholder="Name" class="form-control mb-4 col-4"/>
        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger">Name Error</span>
    </p>

    <p>
        <label for="price">Price:</label>
        <input type="text" id="price" th:field="*{price}" placeholder="Price" class="form-control mb-4 col-4"/>
        <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="text-danger">Price Error</span>
    </p>

    <p>
        <label for="inv">Inventory:</label>
        <input type="text" id="inv" th:field="*{inv}" placeholder="Inventory" class="form-control mb-4 col-4"/>
        <span th:if="${#fields.hasErrors('inv')}" th:errors="*{inv}" class="text-danger">Inventory Error</span>
    </p>

    <p>
        <label for="min">Minimum Inventory:</label>
        <input type="text" id="min" th:field="*{min}" placeholder="Minimum Inventory" class="form-control mb-4 col-4"/>
        <span th:if="${#fields.hasErrors('min')}" th:errors="*{min}" class="text-danger">Min Error</span>
    </p>

    <p>
        <label for="max">Maximum Inventory:</label>
        <input type="text" id="max" th:field="*{max}" placeholder="Maximum Inventory" class="form-control mb-4 col-4"/>
        <span th:if="${#fields.hasErrors('max')}" th:errors="*{max}" class="text-danger">Max Error</span>
    </p>

    <p>
        <label for="companyName">Company Name:</label>
        <input type="text" id="companyName" th:field="*{companyName}" placeholder="Company Name" class="form-control mb-4 col-4"/>
        <span th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}" class="text-danger">Company Name Error</span>
    </p>

    <p><input type="submit" value="Submit" /></p>

</form>

<a th:href="@{/mainscreen}">Link to Main Screen</a>
</body>
</html>
